services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eletrohub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 1. Discovery Service (Eureka) ───────────────────────────────────────────
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # ── 2. Config Service ───────────────────────────────────────────────────────
  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── 3. Gateway Service ──────────────────────────────────────────────────────
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8765:8765"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      discovery-service:
        condition: service_healthy

  # ── 4. Greeting Service ─────────────────────────────────────────────────────
  greeting-service:
    build: ./greeting-service
    container_name: greeting-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  # ── 5. Auth Service ─────────────────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8900:8900"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_user
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ── 6. Currency Service ─────────────────────────────────────────────────────
  currency-service:
    build: ./currency-service
    container_name: currency-service
    ports:
      - "8100:8100"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_currency
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ── 7. Product Service ──────────────────────────────────────────────────────
  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_product
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      currency-service:
        condition: service_started

  # ── 8. Order Service ────────────────────────────────────────────────────────
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8300:8300"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      product-service:
        condition: service_started

  # ── 9. Marketplace Service ──────────────────────────────────────────────────
  marketplace-service:
    build: ./marketplace-service
    container_name: marketplace-service
    ports:
      - "8200:8200"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_marketplace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

volumes:
  pgdata:
