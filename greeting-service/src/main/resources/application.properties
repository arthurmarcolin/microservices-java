spring.application.name=greeting-service
server.port=8080

greeting-service.greeting=Ola
greeting-service.default-name=Mundo

spring.profiles.active=fr

eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,circuit-breakers,circuit-breaker-events
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
eureka.instance.metadata-map.github.repo=arthurmarcolin/microservices-java

spring.config.import=optional:configserver:http://localhost:8888/

info.app.name=${spring.application.name}
info.app.description=Microservice utilizado para fornecer mensagens de saudacao por meio de uma API REST.
info.app.autor=Arthur Marcolin